version: '3.8'

services:
  # NGINX Reverse Proxy - Adds X-Forwarded-For header
  nginx:
    image: nginx:alpine
    container_name: apollo-captive-nginx
    ports:
      - "8082:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - captive-payment-gateway
    restart: unless-stopped
    networks:
      - portainer_default

  # FastAPI Payment Gateway
  captive-payment-gateway:
    image: marcandres888/apollo-captive-paymentgateway:latest
    container_name: apollo-captive-paymentgateway
    expose:
      - "8000"
    environment:
      - PAYMENT_URL=https://www.coronatel.com/
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    networks:
      - portainer_default

networks:
  portainer_default:
    external: true
